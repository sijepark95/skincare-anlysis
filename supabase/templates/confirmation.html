<!doctype html>
<html lang="en">
  <body style="margin:0;padding:32px;background:#f7f5f1;color:#34312f;font-family:Arial,sans-serif">
    <main style="max-width:480px;margin:auto;padding:32px;background:#fff;border-radius:16px">
      <p style="font-size:14px;letter-spacing:3px">SENMIVA</p>
      <h1 style="font-size:24px">Verify your email address</h1>
      <p>Enter this code on the Senmiva account creation page:</p>
      <p data-senmiva-verification-code style="font-size:32px;letter-spacing:8px;font-weight:bold">{{ .Token }}</p>
      <p>This code expires in one hour. Keep it private.</p>
      <p>If you did not create a Senmiva business account, ignore this email.</p>
    </main>
  </body>
</html>
